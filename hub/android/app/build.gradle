plugins { id 'com.android.application' }

android {
    namespace 'com.edwardlabs.gameshub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.edwardlabs.gameshub'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    // Chave fixa: cada nova versão instala por cima da anterior sem perder jogos baixados nem progresso.
    signingConfigs {
        fixed {
            storeFile file('../hub.keystore')
            storePassword 'android'
            keyAlias 'hub'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.fixed; minifyEnabled false }
        release { signingConfig signingConfigs.fixed; minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
