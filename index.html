<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GamesHub - Free HTML5 Games</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a3a;
    --text: #e4e4ef;
    --text2: #8888aa;
    --accent: #7c3aed;
    --accent2: #a855f7;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent2);
    text-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
    letter-spacing: -1px;
  }
  .logo span { color: var(--text); font-weight: 400; }
  .header-stats {
    font-size: 12px;
    color: var(--text2);
  }

  /* Search & Filters */
  .controls {
    max-width: 1200px;
    margin: 24px auto;
    padding: 0 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .search {
    flex: 1;
    min-width: 200px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: var(--text2); }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 18px;
    color: var(--text2);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

  /* Grid */
  .grid {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px 40px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(124, 58, 237, 0.15); }
  .card-banner {
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    position: relative;
    overflow: hidden;
  }
  .card-banner::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0.15;
    background: radial-gradient(circle at 30% 50%, currentColor, transparent 70%);
  }
  .card-banner .icon {
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 0 12px currentColor);
  }
  .card-body { padding: 16px; }
  .card-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .card-desc { font-size: 12px; color: var(--text2); line-height: 1.5; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 10px; padding: 3px 8px; border-radius: 4px; background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
  .tag.cat { color: var(--accent2); border-color: rgba(168, 85, 247, 0.3); }
  .badge-new {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--green);
    color: #000;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    z-index: 2;
  }

  /* Detail panel */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; }
  .overlay.active { display: flex; align-items: center; justify-content: center; }
  .detail {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 90%;
    max-width: 500px;
    padding: 32px;
    position: relative;
  }
  .detail-close {
    position: absolute;
    top: 12px;
    right: 16px;
    background: none;
    border: none;
    color: var(--text2);
    font-size: 24px;
    cursor: pointer;
  }
  .detail-close:hover { color: var(--text); }
  .detail h2 { font-size: 24px; margin-bottom: 8px; }
  .detail .desc { color: var(--text2); font-size: 13px; line-height: 1.6; margin-bottom: 16px; }
  .detail-info { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .detail-info div { font-size: 12px; }
  .detail-info .label { color: var(--text2); margin-bottom: 2px; }
  .play-btn {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    letter-spacing: 1px;
  }
  .play-btn:hover { background: var(--accent2); }

  /* Player */
  .player-overlay { position: fixed; inset: 0; background: #000; z-index: 300; display: none; flex-direction: column; }
  .player-overlay.active { display: flex; }
  .player-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .player-bar .title { font-size: 14px; font-weight: 600; }
  .player-bar button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    border-radius: 4px;
  }
  .player-bar button:hover { border-color: var(--accent); }
  .player-frame { flex: 1; border: none; width: 100%; height: 100%; }

  /* Empty state */
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text2);
  }
  .empty h3 { font-size: 18px; margin-bottom: 8px; color: var(--text); }

  /* Loading */
  .loading {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px;
    color: var(--text2);
    font-size: 14px;
  }
  .loading::after {
    content: '';
    display: block;
    width: 30px;
    height: 30px;
    margin: 16px auto 0;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Responsive */
  @media (max-width: 600px) {
    .header { padding: 12px 16px; }
    .logo { font-size: 18px; }
    .controls { padding: 0 16px; }
    .grid { padding: 0 16px 24px; grid-template-columns: 1fr; }
    .detail { width: 95%; padding: 24px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="logo">Games<span>Hub</span></div>
  <div class="header-stats" id="stats">Loading...</div>
</header>

<div class="controls">
  <input type="text" class="search" id="search" placeholder="Search games... (press / to focus)" autocomplete="off">
  <button class="filter-btn active" data-cat="all" onclick="setFilter('all')">All</button>
  <div id="filterButtons"></div>
</div>

<div class="grid" id="grid">
  <div class="loading">Discovering games...</div>
</div>

<!-- Detail overlay -->
<div class="overlay" id="detailOverlay" onclick="closeDetail(event)">
  <div class="detail" id="detailPanel"></div>
</div>

<!-- Player overlay -->
<div class="player-overlay" id="playerOverlay">
  <div class="player-bar">
    <span class="title" id="playerTitle">Game</span>
    <button onclick="closePlayer()">ESC to Close</button>
  </div>
  <iframe class="player-frame" id="playerFrame" sandbox="allow-scripts allow-same-origin"></iframe>
</div>

<script>
const CATALOG_URL = 'games-catalog.json';
const CATEGORY_ICONS = {
  'Arcade': '🕹️', 'Puzzle': '🧩', 'Action': '⚔️', 'Strategy': '♟️',
  'Racing': '🏎️', 'Sports': '⚽', 'RPG': '🗡️', 'Casual': '🎲'
};

let allGames = [];
let currentFilter = 'all';
let currentSearch = '';

async function init() {
  try {
    const resp = await fetch(CATALOG_URL);
    if (!resp.ok) throw new Error('Catalog not found');
    const data = await resp.json();
    allGames = data.games || [];
    document.getElementById('stats').textContent = `${allGames.length} free games`;
    buildFilters(data.categories || []);
    render();
  } catch (e) {
    document.getElementById('grid').innerHTML = `
      <div class="empty">
        <h3>No catalog found</h3>
        <p>Push games to /games/ and the catalog will be auto-generated.</p>
      </div>
    `;
    document.getElementById('stats').textContent = 'No games yet';
  }
}

function buildFilters(categories) {
  const container = document.getElementById('filterButtons');
  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.cat = cat;
    btn.textContent = cat;
    btn.onclick = () => setFilter(cat);
    container.appendChild(btn);
  });
}

function setFilter(cat) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === cat);
  });
  render();
}

function render() {
  const grid = document.getElementById('grid');
  let games = allGames;

  if (currentFilter !== 'all') {
    games = games.filter(g => g.category === currentFilter);
  }
  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    games = games.filter(g =>
      g.title.toLowerCase().includes(q) ||
      g.description.toLowerCase().includes(q) ||
      (g.tags || []).some(t => t.toLowerCase().includes(q))
    );
  }

  if (games.length === 0) {
    grid.innerHTML = `<div class="empty"><h3>No games found</h3><p>Try a different search or filter.</p></div>`;
    return;
  }

  const now = new Date();
  grid.innerHTML = games.map(g => {
    const daysSince = Math.floor((now - new Date(g.date)) / 86400000);
    const isNew = daysSince <= 7;
    const icon = CATEGORY_ICONS[g.category] || '🎮';
    const accentColor = g.color || '#7c3aed';
    return `
      <div class="card" onclick='showDetail(${JSON.stringify(g).replace(/'/g, "&#39;")})'>
        ${isNew ? '<div class="badge-new">NEW</div>' : ''}
        <div class="card-banner" style="color:${accentColor}">
          <span class="icon">${icon}</span>
        </div>
        <div class="card-body">
          <div class="card-title">${esc(g.title)}</div>
          <div class="card-desc">${esc(g.description)}</div>
          <div class="card-meta">
            <span class="tag cat">${esc(g.category)}</span>
            <span class="tag">${esc(g.difficulty || 'N/A')}</span>
            <span class="tag">v${esc(g.version || '1.0')}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function showDetail(game) {
  const icon = CATEGORY_ICONS[game.category] || '🎮';
  document.getElementById('detailPanel').innerHTML = `
    <button class="detail-close" onclick="closeDetailDirect()">&times;</button>
    <h2>${icon} ${esc(game.title)}</h2>
    <p class="desc">${esc(game.description)}</p>
    <div class="detail-info">
      <div><div class="label">Category</div>${esc(game.category)}</div>
      <div><div class="label">Difficulty</div>${esc(game.difficulty || 'N/A')}</div>
      <div><div class="label">Controls</div>${esc(game.controls || 'Keyboard')}</div>
      <div><div class="label">Version</div>${esc(game.version || '1.0')}</div>
      <div><div class="label">Author</div>${esc(game.author || 'Unknown')}</div>
      <div><div class="label">Added</div>${esc(game.date || 'N/A')}</div>
    </div>
    <button class="play-btn" onclick='playGame("${esc(game.path)}/index.html", "${esc(game.title)}")'>PLAY NOW</button>
  `;
  document.getElementById('detailOverlay').classList.add('active');
}

function closeDetail(e) {
  if (e.target === e.currentTarget) {
    document.getElementById('detailOverlay').classList.remove('active');
  }
}

function closeDetailDirect() {
  document.getElementById('detailOverlay').classList.remove('active');
}

function playGame(url, title) {
  document.getElementById('detailOverlay').classList.remove('active');
  document.getElementById('playerTitle').textContent = title;
  document.getElementById('playerFrame').src = url;
  document.getElementById('playerOverlay').classList.add('active');
}

function closePlayer() {
  document.getElementById('playerOverlay').classList.remove('active');
  document.getElementById('playerFrame').src = '';
}

function esc(s) {
  const el = document.createElement('span');
  el.textContent = s;
  return el.innerHTML;
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePlayer();
  if (e.key === '/' && !e.ctrlKey && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('search').focus();
  }
});

document.getElementById('search').addEventListener('input', e => {
  currentSearch = e.target.value;
  render();
});

init();
</script>
</body>
</html>
