name: Punho de Dragão Android APK

on:
  push:
    branches: [main]
    paths:
      - 'games/punho-de-dragao/**'
      - '.github/workflows/build-punho-de-dragao.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: punho-de-dragao-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (pré-instalado no runner)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          ls "$SDK/platforms" "$SDK/build-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          set -euo pipefail
          cd games/punho-de-dragao
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp controle.html android/app/src/main/assets/controle.html
          cd android
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK and signature
        id: verify
        run: |
          set -euo pipefail
          APK=games/punho-de-dragao/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --verbose "$APK"
          $BT/aapt dump badging "$APK" | head -5
          VER=$(grep versionName games/punho-de-dragao/android/app/build.gradle | sed -E "s/.*'(.*)'.*/\1/")
          mkdir -p out
          cp "$APK" "out/Punho-de-Dragao-v$VER.apk"
          (cd out && sha256sum *.apk > SHA256.txt)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Punho-de-Dragao-v${{ steps.verify.outputs.ver }}-Android
          path: out/*.apk
          if-no-files-found: error

      - name: Publish APK to branch apk-punho-de-dragao
        run: |
          set -euo pipefail
          cd out
          git init -q -b apk-punho-de-dragao
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          printf '# Punho de Dragão — APK\n\nGerado a partir de %s.\n' "$GITHUB_SHA" > README.md
          git add -A
          git commit -q -m "APK v${{ steps.verify.outputs.ver }} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:apk-punho-de-dragao
