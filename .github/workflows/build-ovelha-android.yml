name: Ovelha de Giz Android APK
on:
  push:
    paths:
      - 'games/ovelha-de-giz/**'
      - '.github/workflows/build-ovelha-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build official Android APK
        run: |
          set -euo pipefail
          cd games/ovelha-de-giz
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cd android
          gradle --no-daemon :app:assembleDebug
      - name: Verify APK and signature
        run: |
          set -euo pipefail
          APK=games/ovelha-de-giz/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -20
          cp "$APK" Ovelha-de-Giz-v1.0.2.apk
          sha256sum Ovelha-de-Giz-v1.0.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ovelha-de-Giz-v1.0.2-Android
          path: Ovelha-de-Giz-v1.0.2.apk
          if-no-files-found: error
