<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>Punho de Dragão</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Silkscreen&display=swap">
<style>
/* Gabinete de fliperama: tela no centro, controles abaixo (retrato) ou sobre a tela (paisagem). Tema único escuro. */
:root{
  --cab:#120d18; --bezel:#1f1729; --line:#3a2c48; --ink:#f1e6d6; --dim:#9c8fae;
  --fire:#ff7a1a; --gold:#ffd23f; --red:#d7263d;
  --display:"Bungee","Impact","Arial Black",sans-serif;
  --ui:"Silkscreen","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--cab);color:var(--ink);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#screen{position:relative;line-height:0;box-shadow:0 0 0 3px var(--bezel),0 0 0 5px var(--line),0 18px 40px #000a}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#bar{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;max-width:var(--gw,768px);font-family:var(--ui);font-size:12px;color:var(--dim)}
#bar h1{font-family:var(--display);font-size:18px;margin:0;color:var(--gold);letter-spacing:.02em;text-shadow:2px 2px 0 var(--red);font-weight:400}
#bar .acts{display:flex;gap:6px}
.mini{font-family:var(--ui);font-size:11px;color:var(--ink);background:var(--bezel);border:1px solid var(--line);border-radius:4px;padding:6px 9px;cursor:pointer}
.mini:focus-visible,.tb:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#help{font-family:var(--ui);font-size:11px;color:var(--dim);text-align:center;max-width:var(--gw,768px);line-height:1.6}
#help b{color:var(--ink);font-weight:400}
/* controles de toque */
#touch{display:none;position:relative;width:100%;max-width:var(--gw,768px);flex:1;min-height:150px;max-height:260px}
.touch-on #touch{display:block}
.touch-on #help{display:none}
#stickzone{position:absolute;left:0;top:0;bottom:0;width:45%}
#stick{position:absolute;width:118px;height:118px;border-radius:50%;border:2px solid #ffffff30;background:#ffffff0d;left:20px;bottom:20px;pointer-events:none}
#knob{position:absolute;width:52px;height:52px;border-radius:50%;background:#ffffff38;border:2px solid #ffffff55;left:31px;top:31px}
#btns{position:absolute;right:6px;bottom:14px;width:208px;height:170px}
.tb{position:absolute;width:76px;height:76px;border-radius:50%;font-family:var(--ui);font-size:12px;color:#fff;border:2px solid #ffffff60;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.tb.on{filter:brightness(1.6);transform:scale(.94)}
.tb[data-b=p]{right:96px;bottom:0;background:#d7263dcc}
.tb[data-b=k]{right:0;bottom:30px;background:#2f6fdfcc}
.tb[data-b=j]{right:68px;bottom:88px;background:#2e9e5bcc;width:64px;height:64px}
.tb[data-b=s]{right:0;bottom:118px;background:#9b4dcacc;width:58px;height:58px;font-size:9px}
/* paisagem no celular: controles sobre a tela */
.touch-on.land #app{gap:0}
.touch-on.land #bar{display:none}
.touch-on.land #touch{position:fixed;inset:0;max-width:none;max-height:none;pointer-events:none;z-index:5}
.touch-on.land #stickzone,.touch-on.land .tb{pointer-events:auto}
.touch-on.land #btns{right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));opacity:.85}
.touch-on.land #stick{left:calc(18px + env(safe-area-inset-left,0px))}
#pz{display:none;position:fixed;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:6;opacity:.8}
.touch-on.land #pz{display:block}
@media (prefers-reduced-motion:reduce){.tb.on{transform:none}}
.tv body{padding-left:0;padding-right:0}.tv #bar,.tv #help,.tv #touch,.tv #pz{display:none!important}.tv #app{gap:0}.tv #screen{box-shadow:none}
</style>

</head><body>

 const wn=st.waves.length;G.wavesX=st.waves.map((_,k)=>Math.round((k+1)*(st.len-W)/(wn+1)));G.maxCam=G.wavesX[0];G.waveActive=false;
 G.props=st.props.map(([x,t,fz])=>newEnt({kind:'prop',ptype:t,x,z:ZMIN+4+fz*(ZMAX-ZMIN-10),hp:2,mhp:2,k:1.45,h:36}));G.bossBanner=0;G.boss=null;
 const hp=player?player.hp:100;player=makePlayer(60);if(keepScore)player.hp=Math.max(hp,60);G.ents.push(player);
 AU.music(i,false);try{wakeLock()}catch(e){}}
function spawnEnemy(type,side,stageIdx,v){const T=ETYPES[type],look=enemyLook(type,stageIdx,v),key=type+'_'+stageIdx+'_'+v,F=buildFigure(key,look);
 const x=side>0?G.camX+W+24:G.camX-24,e=newEnt({kind:'e',type,T,F,k:look.k,h:F.h,x,z:rr(ZMIN+6,ZMAX-6),hp:T.hp,mhp:T.hp,name:T.name,st:'enter',f:-side,cd:rr(40,90),hoverOff:rr(-14,14),hz:rr(ZMIN+6,ZMAX-6)});

function spawnBoss(id){const B=BOSSES[id],F=buildFigure('boss_'+id,{k:B.k,bulk:B.bulk,hair:B.hair,beard:B.beard,c:B.c,sleeve:B.sleeve,vest:B.vest,shades:B.shades,glove:B.glove});
 const e=newEnt({kind:'b',boss:id,B,T:{moves:['e_jab','e_cross'],range:30,spd:0.9},F,k:B.k,h:F.h,x:G.camX+W+30,z:(ZMIN+ZMAX)/2,hp:B.hp,mhp:B.hp,name:B.name,st:'enter',f:-1,cd:60});

/* ================= COMBATE ================= */
function scaleOf(e){return e.kind==='p'?1:e.k/1.45}
function setSt(e,s){e.st=s;e.t=0}
function startAtk(e,name){const A=ATK[name];e.atk={...A,name};e.hitSet.clear();setSt(e,'atk');e.anim=A.anim;e.fi=0;if(e.kind!=='p'){const m=e.kind==='b'?0.75:1;e.atk.s=Math.round(A.s*m*diff().slow)}}
function hitTest(a,A,t,back){const sc=scaleOf(a),x0=a.x+a.f*A.rx*sc,x1=a.x+a.f*(A.rx+A.rw)*sc,lo=Math.min(x0,x1),hi=Math.max(x0,x1),hw=9*scaleOf(t);
 if(t.x+hw<lo||t.x-hw>hi)return false;if(Math.abs(t.z-a.z)>8+(A.dz||0)+3*sc)return false;const yl=a.y+A.yl*sc,yh=a.y+A.yh*sc;if(t.y>yh||t.y+t.h*0.95<yl)return false;return true}
function canBeHit(t){return!(t.inv>0||t.st==='down'||t.st==='getup'||t.st==='dead'||t.st==='enter'&&t.kind!=='p'&&(t.x<G.camX-4||t.x>G.camX+W+4)||t.st==='tele'&&t.alpha<0.5)}
function applyHit(a,t,A){
 if(t.kind==='b'&&t.st==='counter'){t.f=sgn(a.x-t.x);spark(t.x+t.f*8,t.z,t.y+t.h*0.6,'#9ad0ff');AU.sfx('whiff');startAtk(t,'e_upper');t.atk.s=4;return}
 let dmg=A.dmg;if(t.kind==='p')dmg=Math.max(1,Math.round(dmg*diff().dmg*(a.kind==='b'?1.3:1)));
 t.hp-=dmg;t.flash=6;G.hitstop=Math.max(G.hitstop,A.hs||3);if(t.kind==='p')phones(t.hp<=0?'ko':'hit');
 const dir=a.kind==='p'&&A.anim==='spin'?sgn(t.x-a.x):a.f;
 spark(t.x-dir*4,t.z,t.y+t.h*0.62,A.down?'#ffd23f':'#ffffff');AU.sfx(A.down?'heavy':'hit');
 if(a.kind==='p'){G.score+=dmg*10;G.lastFoe=t;G.lastFoeT=180}
 const armored=(t.kind==='b'&&(t.st==='charge'||t.st==='pound'||t.st==='dash'||t.st==='cast'))||(t.T&&t.T.armor&&t.st==='atk'&&!A.down);
 if(t.hp<=0){t.hp=0;knock(t,dir,true);if(t.kind!=='p'){G.score+=t.kind==='b'?5000:200;popText(t.x,t.z,t.y+t.h,t.kind==='b'?'K.O.!':'POW!')}else AU.sfx('ko');G.shake=Math.max(G.shake,t.kind==='b'?14:6);return}
 if(armored){return}
 if(A.down){knock(t,dir,false);G.shake=Math.max(G.shake,4);return}
 t.juggle=(t.juggle||0)+1;if(t.juggle>=5&&t.kind!=='p'){knock(t,dir,false);return}
 setSt(t,'hurt');t.anim='hurt';t.fi=0;t.stun=A.stun||14;t.vx=dir*A.kb;t.f=-dir;t.atk=null;t.chain=null;if(t.kind==='p')AU.sfx('hurt')}
function knock(t,dir,ko){t.chain=null;t.wantCombo=false;setSt(t,'fall');t.anim='fall';t.fi=0;t.vy=2.8;t.y=Math.max(t.y,1);t.vx=dir*2.2;t.f=-dir;t.atk=null;t.juggle=0;t.ko=ko}
function spark(x,z,y,col){for(let i=0;i<7;i++){const a=rnd()*Math.PI*2,s=rr(1,2.6);G.parts.push({ty:'spark',x,z:z+0.5,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:12,col})}G.parts.push({ty:'star',x,z:z+0.5,y,life:6,col})}
function dust(x,z,n){for(let i=0;i<n;i++)G.parts.push({ty:'dust',x:x+rr(-8,8),z,y:rr(0,3),vx:rr(-0.8,0.8),vy:rr(0.2,0.8),life:rr(14,26)|0})}
function popText(x,z,y,s){G.parts.push({ty:'text',x,z,y,vy:0.6,life:50,s})}

/* ================= ATUALIZAÇÃO DOS LUTADORES ================= */
function physics(e){e.x+=e.vx;e.z+=e.vz;e.z=clamp(e.z,ZMIN,ZMAX);
 if(e.y>0||e.vy>0){e.y+=e.vy;e.vy-=GRAV;if(e.y<=0){e.y=0;e.vy=0;land(e)}}
 if(e.kind==='p')e.x=clamp(e.x,G.camX+10,G.camX+W-10);else if(e.st!=='enter'&&e.st!=='charge')e.x=clamp(e.x,G.camX+8,G.camX+W-8)}
function land(e){if(e.st==='fall'){setSt(e,'down');e.anim='down';e.vx*=0.3;dust(e.x,e.z,6);AU.sfx('land');G.shake=Math.max(G.shake,2)}
 else if(e.st==='jump'||e.st==='jkick'){setSt(e,'land');e.anim='land';e.vx=0;e.vz=0;dust(e.x,e.z,3);AU.sfx('land')}
 else if(e.st==='pound'){poundLand(e)}
 else if(e.st==='dash'){setSt(e,'land');e.anim='getup';e.vx=0}}
function commonStates(e){
 if(e.st==='hurt'){e.vx*=0.82;if(e.t>=e.stun){setSt(e,'idle');e.vx=0}return true}
 if(e.st==='fall'){e.anim='fall';return true}
 if(e.st==='down'){e.vx*=0.85;if(e.t>(e.kind==='p'?50:40)){if(e.hp<=0){setSt(e,'dead')}else{setSt(e,'getup');e.anim='getup';e.inv=e.kind==='p'?40:20}}return true}
 if(e.st==='getup'){if(e.t>16){setSt(e,'idle');e.juggle=0}return true}
 if(e.st==='dead'){e.alpha=(e.t>>2)%2?0.3:1;if(e.kind==='p'){if(e.t>70)playerDied()}else if(e.t>50)e.remove=true;return true}
 if(e.st==='land'){if(e.t>7)setSt(e,'idle');return true}
 return false}
function runAtk(e){const A=e.atk,t=e.t,tot=A.s+A.a+A.r;e.anim=A.anim;
 const nf=(e.F||HERO)[A.anim].length;e.fi=t<A.s?0:(t<A.s+A.a||nf<3)?Math.min(1,nf-1):Math.min(2,nf-1);
 if(t===A.s){AU.sfx('whiff');if(A.lunge)e.vx=e.f*A.lunge}
 if(t>=A.s+A.a)e.vx*=0.6;
 if(t>=A.s&&t<A.s+A.a){for(const o of targetsOf(e)){if(e.hitSet.has(o)||!canBeHit(o))continue;if(hitTest(e,A,o)){e.hitSet.add(o);if(o.kind==='prop')hitProp(o,e);else applyHit(e,o,A)}}}
 return t>=tot}
function targetsOf(e){return e.kind==='p'?G.ents.filter(o=>o.kind!=='p').concat(G.props):[player]}
// --- jogador
function updatePlayer(p){p.t++;if(p.inv>0)p.inv--;if(p.flash>0)p.flash--;if(p.comboT>0)p.comboT--;else p.combo=0;
 if(G.mode!=='play'||G.banner>110){p.vx=p.vz=0;physics(p);if(G.mode==='clear'&&p.st!=='win'&&p.y===0&&!['fall','down','getup','dead'].includes(p.st)){setSt(p,'win');p.anim='win'}if(p.st==='win'){p.fi=(p.t>>4)%2}return}
 if(commonStates(p)){physics(p);animStep(p);return}
 const dx=(IN.r?1:0)-(IN.l?1:0),dz=(IN.d?1:0)-(IN.u?1:0);
 const lt=G.latch;G.latch=null;const wantP=P('p')||lt==='p',wantK=P('k')||lt==='k',wantJ=P('j'),wantS=P('s')||(IN.p&&IN.k&&(P('p')||P('k')));
 if(p.st==='atk'){if(wantP)p.buf='p';if(wantK)p.buf='k';const A=p.atk,done=runAtk(p);const canChain=p.t>=A.s+A.a+Math.floor(A.r*0.35);
  if(p.buf&&canChain&&p.combo<3){const b=p.buf;p.buf=null;doAttack(p,b)}else if(done){setSt(p,'idle');p.buf=null;p.vx=0}physics(p);return}
 if(p.st==='spin'){p.anim='spin';p.fi=(p.t>>2)%2;p.inv=Math.max(p.inv,2);p.vx=p.f*0.6;const A=ATK.spin;if(p.t===2){AU.sfx('special');p.hitSet.clear()}if(p.t===14)p.hitSet.clear();
  for(const o of targetsOf(p)){if(p.hitSet.has(o)||!canBeHit(o))continue;if(hitTest(p,A,o)){p.hitSet.add(o);o.kind==='prop'?hitProp(o,p):applyHit(p,o,A)}}if(p.t>26){setSt(p,'idle');p.vx=0}physics(p);return}
 if(p.st==='jump'||p.st==='jkick'){if(p.st==='jump'){p.anim='jump';p.fi=p.vy>1?0:p.vy>-1?1:2;if(wantP||wantK){setSt(p,'jkick');p.anim='jkick';p.fi=0;p.hitSet.clear();AU.sfx('whiff')}}
  else{p.anim='jkick';p.fi=0;const A=ATK.jkick;for(const o of targetsOf(p)){if(p.hitSet.has(o)||!canBeHit(o))continue;if(hitTest(p,A,o)){p.hitSet.add(o);o.kind==='prop'?hitProp(o,p):applyHit(p,o,A)}}}
  physics(p);return}
 // parado/andando
 if(wantS&&p.hp>8){p.hp-=6;setSt(p,'spin');p.combo=0;return}
 if(wantJ){setSt(p,'jump');p.vy=4.4;p.y=0.1;p.vx=dx*1.7;p.vz=dz*0.7;if(dx)p.f=dx;AU.sfx('jump');physics(p);return}
 if(wantP){if(dx)p.f=dx;doAttack(p,'p');physics(p);return}
 if(wantK){if(dx)p.f=dx;doAttack(p,'k');physics(p);return}
 if(dx||dz){p.vx=dx*1.45;p.vz=dz*1.0;if(dx)p.f=dx;if(p.st!=='walk'){setSt(p,'walk')}p.anim='walk';p.fi=((p.t/6)|0)%p.F.walk.length}
 else{p.vx=0;p.vz=0;if(p.st!=='idle')setSt(p,'idle');p.anim='idle';p.fi=((p.t/9)|0)%p.F.idle.length}
 physics(p);
 for(const it of G.items){if(!it.got&&Math.abs(it.x-p.x)<14&&Math.abs(it.z-p.z)<9){it.got=true;p.hp=Math.min(p.mhp,p.hp+it.heal);G.score+=it.pts;AU.sfx('pick');popText(it.x,it.z,20,it.heal?'+'+it.heal:'+'+it.pts)}}}
function doAttack(p,b){let name;if(b==='p'){name=p.combo===0?'jab':p.combo===1?'cross':'upper'}else{name=p.combo>=2?'round':'kick'}
 p.combo=b==='p'?Math.min(3,p.combo+1):(p.combo>=2?3:p.combo+1);if(name==='upper'||name==='round')p.combo=3;p.comboT=30;startAtk(p,name);if(p.combo>=3)p.comboT=0}
function animStep(e){const n=(e.F||HERO)[e.anim]?(e.F||HERO)[e.anim].length:1;if(e.anim==='idle'||e.anim==='walk')e.fi=((e.t/(e.anim==='walk'?7:10))|0)%n;else if(e.anim==='win')e.fi=((e.t/16)|0)%n;else e.fi=Math.min(e.fi,n-1)}
function playerDied(){if(G.lives>1){G.lives--;player.hp=player.mhp;player.alpha=1;setSt(player,'getup');player.anim='getup';player.inv=150;player.y=0;for(const e of G.ents)if(e!==player&&(e.kind==='e'||e.kind==='b')&&e.st!=='dead'&&e.st!=='down'){knock(e,sgn(e.x-player.x),false);e.vy=1.6}popText(player.x,player.z,player.h,'VAMOS!')}else{G.lives=0;G.mode='over';G.overT=600;AU.stopMusic();AU.sfx('over')}}
// --- inimigos
function updateEnemy(e){e.t++;if(e.inv>0)e.inv--;if(e.flash>0)e.flash--;
 if(commonStates(e)){physics(e);animStep(e);return}
 const p=player,dx=p.x-e.x,dz=p.z-e.z,adx=Math.abs(dx),spd=e.T.spd*(e.kind==='b'?1:1)*(save.diff===0?0.85:1);
 if(e.st==='enter'){const inX=e.x>G.camX+14&&e.x<G.camX+W-14;e.vx=sgn(G.camX+W/2-e.x)*Math.max(0.9,spd);e.vz=0;e.f=sgn(e.vx);e.anim='walk';animStep(e);physics(e);e.x+=0;if(inX&&e.t>8){setSt(e,'idle');e.vx=0}return}
 if(e.st==='atk'){if(runAtk(e)){if(e.chain&&e.chain.length){startAtk(e,e.chain.shift())}else{setSt(e,'idle');e.vx=0;e.cd=rr(45,100)*diff().slow*(e.kind==='b'?0.55:1)}}physics(e);return}
 if(bossStates(e)){physics(e);return}
 if(e.st==='throw'){e.anim='throw';e.fi=e.t<16?0:1;if(e.t===16){shoot(e,'knife',0)}if(e.t>34){setSt(e,'idle');e.cd=rr(70,130)*diff().slow}physics(e);return}
 if(p.st==='dead'||G.mode!=='play'){e.vx=sgn(e.x-p.x)*0.5;e.vz=0;e.anim='walk';animStep(e);physics(e);return}
 e.cd--;
 if(e.kind==='b'&&e.cd<=0&&!e.wantCombo&&adx<170){if(bossChoose(e)){physics(e);return}}
 const engaged=e.kind==='b'||e.token;let tx,tz;
 if(e.T.ranged&&!engaged){tx=p.x-sgn(dx||1)*110;tz=p.z;if(Math.abs(dz)<5&&adx>70&&adx<220&&e.cd<=0){e.f=sgn(dx);if(e.T.ranged==='fire'){setSt(e,'cast');e.castKind='fire'}else setSt(e,'throw');e.vx=e.vz=0;physics(e);return}}
 else if(engaged){const rg=e.T.range*scaleOf(e);let side=-sgn(dx||1);tx=p.x+side*rg;if(tx<G.camX+12||tx>G.camX+W-12){side=-side;tx=p.x+side*rg}tz=p.z;
  if(adx>=rg*0.45&&adx<=rg+6&&Math.abs(dz)<4&&e.cd<=0&&p.y<30){e.f=sgn(dx);const mv=pick(e.T.moves);e.wantCombo=false;if(mv==='dash'){startDash(e)}else if(mv==='charge'){startCharge(e)}else{startAtk(e,mv);if(e.kind==='b')e.chain=pick([['e_cross'],['e_cross','e_upper'],['e_kick','e_round'],['e_jab','e_jab','e_round']]).slice()}physics(e);return}}
 else{tx=p.x-sgn(dx||1)*(78+e.hoverOff);if(e.t%120===0)e.hz=rr(ZMIN+6,ZMAX-6);tz=e.hz}
 const mx=tx-e.x,mz=tz-e.z;e.vx=Math.abs(mx)>3?sgn(mx)*spd:0;e.vz=Math.abs(mz)>2?sgn(mz)*spd*0.7:0;
 for(const o of G.ents)if(o!==e&&o.kind!=='p'&&o.st!=='dead'&&Math.abs(o.x-e.x)<16&&Math.abs(o.z-e.z)<7){e.vx+=sgn(e.x-o.x)*0.4;e.vz+=sgn(e.z-o.z||1)*0.3}
 e.f=adx>2?sgn(dx):e.f;if(e.vx||e.vz){e.anim='walk'}else e.anim='idle';animStep(e);physics(e)}
function startDash(e){setSt(e,'dash');e.anim='jkick';e.fi=0;e.vy=2.2;e.y=0.1;e.vx=e.f*3.4;e.hitSet.clear();AU.sfx('whiff')}
function startCharge(e){setSt(e,'charge');e.anim='charge';e.vx=0;e.hitSet.clear()}
function bossChoose(e){const bm=e.B.bm,rage=e.hp<e.mhp*0.5;let tot=0;for(const k in bm)tot+=bm[k];let r=rnd()*tot,m='combo';for(const k in bm){r-=bm[k];if(r<=0){m=k;break}}
 const p=player;e.f=sgn(p.x-e.x);
 if(m==='combo'){e.wantCombo=true;return false}
 if(m==='charge'){e.z+=clamp(p.z-e.z,-30,30);startCharge(e);return true}
 if(m==='dash'){e.z=p.z+clamp(e.z-p.z,-4,4);startDash(e);e.vx=e.f*3.8;return true}
 if(m==='pound'){setSt(e,'pound');e.anim='pound';e.fi=0;e.vy=5.4;e.y=0.1;e.vx=(p.x-e.x)/43;e.vz=(p.z-e.z)/43;return true}
 if(m==='teleport'){setSt(e,'tele');return true}
 if(m==='summon'){if(G.ents.filter(o=>o.kind==='e'&&o.st!=='dead').length>=3)return false;setSt(e,'cast');e.anim='cast';e.castKind='summon';return true}
 if(m==='knives'){setSt(e,'cast');e.anim='throw';e.castKind='knives';return true}
 if(m==='fireball'){setSt(e,'cast');e.anim='cast';e.castKind=rage||e.boss==='dragao'?'fire3':'fire';return true}
 if(m==='whip'){if(Math.abs(p.x-e.x)>90||Math.abs(p.z-e.z)>6)return false;startAtk(e,'e_whip');return true}
 if(m==='counter'){setSt(e,'counter');e.anim='block';return true}
 return false}
function bossStates(e){const p=player;
 if(e.st==='charge'){const wind=30;if(e.t<wind){e.anim='charge';e.fi=0;e.flash=(e.t>>2)%2?3:0;e.vx=0;e.vz=0;return true}
  e.anim='charge';e.fi=(e.t>>3)%2;e.vx=e.f*4.2;if(e.t%6===0)dust(e.x-e.f*10,e.z,1);
  if(!e.hitSet.has(p)&&canBeHit(p)&&Math.abs(p.x-e.x)<20*scaleOf(e)&&Math.abs(p.z-e.z)<12&&p.y<40){e.hitSet.add(p);applyHit(e,p,{dmg:13,kb:3,down:1,hs:6})}
  if(e.t>wind+70||(e.f>0&&e.x>G.camX+W+10)||(e.f<0&&e.x<G.camX-10)){setSt(e,'idle');e.vx=0;e.x=clamp(e.x,G.camX+10,G.camX+W-10);e.cd=rr(30,70)}return true}
 if(e.st==='dash'){e.anim='jkick';e.fi=0;if(!e.hitSet.has(p)&&canBeHit(p)&&hitTest(e,{rx:0,rw:26,yl:0,yh:44},p)){e.hitSet.add(p);applyHit(e,p,{dmg:9,kb:2.5,down:1,hs:5})}if(e.y===0&&e.t>4){setSt(e,'land');e.vx=0}return true}
 if(e.st==='pound'){e.anim='pound';e.fi=0;return true}
 if(e.st==='recover'){e.anim='pound';e.fi=1;e.vx=0;e.vz=0;if(e.t>30){setSt(e,'idle');e.cd=rr(30,70)}return true}
 if(e.st==='tele'){e.vx=e.vz=0;if(e.t<18){e.alpha=1-e.t/18}else if(e.t===18){e.x=clamp(p.x-p.f*30,G.camX+16,G.camX+W-16);e.z=p.z;e.f=sgn(p.x-e.x)}else{e.alpha=Math.min(1,(e.t-18)/10)}e.anim='idle';if(e.t>30){e.alpha=1;startAtk(e,pick(['e_round','e_upper']));e.atk.s=8}return true}
 if(e.st==='counter'){e.anim='block';e.fi=0;e.vx=e.vz=0;if(e.t>70){setSt(e,'idle');e.cd=20}return true}

  const go=tm>=0||P('p')||P('st')||P('j')||P('k');if(tm>=0)G.menu=tm;
  if(go){AU.resume();AU.sfx('select');if(G.menu===0){G.score=0;G.lives=diff().lives;player=null;startStage(0)}else if(G.menu===1){G.mode='select';G.selIdx=Math.min(save.unlocked,G.selIdx)}else if(G.menu===2){save.diff=save.diff?0:1;persist()}else{AU.setOn(!AU.on);syncSom()}}return}
 if(G.mode==='select'){const tm=tapMenu();if(P('l'))G.selIdx=Math.max(0,G.selIdx-1);if(P('r'))G.selIdx=Math.min(9,G.selIdx+1);if(P('u'))G.selIdx=Math.max(0,G.selIdx-5);if(P('d'))G.selIdx=Math.min(9,G.selIdx+5);
  if(tm>=0)G.selIdx=tm;if((tm>=0||P('p')||P('st'))&&G.selIdx<=save.unlocked){G.score=0;G.lives=diff().lives;player=null;startStage(G.selIdx)}if(P('j')){G.mode='title';G.menu=1}return}
 if(G.mode==='ending'){if(G.t%20===0)for(let i=0;i<14;i++){const a=rnd()*7,s=rr(0.5,2.5),x=rr(40,W-40),y=rr(20,90);for(let j=0;j<1;j++)G.parts.push({ty:'spark',x,z:0,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:40,col:pick(['#ffd23f','#ff4a6a','#4ff0ff','#7cff6a'])})}
  for(const q of G.parts){q.life--;q.x+=q.vx;q.y-=q.vy;q.vy-=0.03}G.parts=G.parts.filter(q=>q.life>0);if(G.endT++>90&&(P('p')||P('st')||tapQ)){tapQ=null;G.mode='title';G.menu=0}return}
 if(G.mode==='pause'){const tm=tapMenu();if(P('u'))G.menu=(G.menu+2)%3;if(P('d'))G.menu=(G.menu+1)%3;if(tm>=0)G.menu=tm;if(P('st')){G.mode='play';return}
  if(tm>=0||P('p')||P('j')){if(G.menu===0)G.mode='play';else if(G.menu===1){G.lives=Math.max(G.lives,1);player=null;startStage(G.stage)}else{G.mode='title';G.menu=0;AU.stopMusic()}}return}
 if(G.mode==='over'){G.overT--;const t=tapQ;tapQ=null;if(P('p')||P('st')||t&&t.y<120){G.cont++;G.lives=diff().lives;G.mode='play';player.hp=player.mhp;player.alpha=1;setSt(player,'getup');player.inv=150;G.score=0;AU.music(G.stage,G.bossOn)}else if(P('j')||G.overT<=0||t){G.mode='title';G.menu=0}return}
 if(G.mode==='play'&&P('st')){G.mode='pause';G.menu=0;return}
 if(G.hitstop>0){G.hitstop--;if(P('p'))G.latch='p';if(P('k'))G.latch='k';return}
 if(G.shake>0)G.shake--;if(G.banner>0)G.banner--;if(G.bossBanner>0)G.bossBanner--;if(G.go>0)G.go--;if(G.lastFoeT>0)G.lastFoeT--;if(G.flash>0)G.flash--;
 for(const e of G.ents){if(e.kind==='p')updatePlayer(e);else updateEnemy(e)}
 for(const o of G.props){if(o.flash>0)o.flash--}
 G.ents=G.ents.filter(e=>!e.remove);G.props=G.props.filter(o=>!o.remove);G.items=G.items.filter(i=>!i.got);
 updateShots();updateParts();
 if(G.mode==='play'){updateCamera();updateWaves()}
 if(G.mode==='clear'){G.clearT++;player.vx=0;if(G.clearT>120&&(P('p')||P('st')||tapQ)){tapQ=null;if(G.stage<9){startStage(G.stage+1,true)}else{G.mode='ending';G.endT=0;G.parts=[];save.best=Math.max(save.best,G.score);persist();AU.sfx('clear')}}}}
let acc=0,last=performance.now();
function frame(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){step();acc-=1000/60}render();requestAnimationFrame(frame)}

/* ================= LAYOUT E BOTÕES ================= */
const root=document.documentElement,screenEl=document.getElementById('screen');
function layout(){const touch=root.classList.contains('touch-on'),vw=innerWidth,vh=innerHeight,land=vw>vh;root.classList.toggle('land',touch&&land);
 let availW=vw-32,availH=vh-(touch?(land?0:Math.min(260,Math.max(170,vh*0.34))):110);if(touch&&land||root.classList.contains('tv')){availW=vw;availH=vh}
 let s=Math.min(availW/W,availH/H);if(s>=1)s=s>=2?Math.floor(s*2)/2:s;const w=Math.floor(W*s),h=Math.floor(H*s);cv.style.width=w+'px';cv.style.height=h+'px';root.style.setProperty('--gw',w+'px')}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));
const bSom=document.getElementById('bSom');function syncSom(){bSom.textContent='SOM: '+(AU.on?'LIGADO':'DESLIGADO')}syncSom();
bSom.onclick=()=>{AU.resume();AU.setOn(!AU.on);syncSom()};
const pauseBtn=()=>{if(G.mode==='play'){G.mode='pause';G.menu=0}else if(G.mode==='pause')G.mode='play'};document.getElementById('bPause').onclick=pauseBtn;document.getElementById('pz').onclick=pauseBtn;
document.getElementById('bFull').onclick=()=>{try{const el=document.documentElement;(el.requestFullscreen?el.requestFullscreen():el.webkitRequestFullscreen&&el.webkitRequestFullscreen())?.catch?.(()=>{});screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}};
let wl=null;async function wakeLock(){try{if(!wl&&navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(G.mode==='play'){G.mode='pause';G.menu=0}wl=null}});
function start(data){initNative();layout();loadHero(()=>{if(data&&data.unlocked!=null)save.unlocked=Math.max(save.unlocked,data.unlocked);requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)})})}
window.claude?.hot?.snapshot?.(()=>({unlocked:save.unlocked}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
window.__nk=(b,v)=>{if(v)AU.resume();kb[b]=v?1:0};window.__back=()=>{if(G.mode==='play'){G.mode='pause';G.menu=0;return'paused'}if(G.mode==='pause'){G.mode='play';return'resumed'}if(G.mode==='select'){G.mode='title';return'menu'}return'exit'};
</script>
