<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Courier New', monospace; color: #f59e0b; overflow: hidden; }
  canvas { border: 2px solid #f59e0b; border-radius: 4px; }
  .screen { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
  .screen h1 { font-size: 48px; text-shadow: 0 0 20px #f59e0b; }
  .screen p { font-size: 14px; opacity: 0.7; }
  .btn { background: none; border: 2px solid #f59e0b; color: #f59e0b; padding: 12px 32px; font-size: 18px; font-family: inherit; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
  .btn:hover { background: #f59e0b; color: #0a0a0a; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="titleScreen" class="screen">
  <h1>PONG</h1>
  <p>First to 5 wins</p>
  <button class="btn" onclick="startGame()">PLAY</button>
  <p>W/S or Arrow Up/Down</p>
</div>

<div id="endScreen" class="screen hidden">
  <h1 id="winner"></h1>
  <button class="btn" onclick="startGame()">REMATCH</button>
</div>

<canvas id="c" width="600" height="400" class="hidden"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 600, H = 400;
const PADDLE_H = 70, PADDLE_W = 10, BALL_R = 6, WIN_SCORE = 5;
let player, cpu, ball, keys = {}, running = false, raf;

function reset() {
  player = { x: 15, y: H/2 - PADDLE_H/2, score: 0 };
  cpu = { x: W - 15 - PADDLE_W, y: H/2 - PADDLE_H/2, score: 0 };
  resetBall();
}

function resetBall() {
  ball = {
    x: W/2, y: H/2,
    vx: (Math.random() > 0.5 ? 1 : -1) * 4,
    vy: (Math.random() - 0.5) * 4
  };
}

function startGame() {
  document.getElementById('titleScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  canvas.classList.remove('hidden');
  reset();
  running = true;
  if (raf) cancelAnimationFrame(raf);
  loop();
}

function loop() {
  update();
  draw();
  if (running) raf = requestAnimationFrame(loop);
}

function update() {
  // Player movement
  if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= 5;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += 5;
  player.y = Math.max(0, Math.min(H - PADDLE_H, player.y));

  // CPU AI
  const cpuCenter = cpu.y + PADDLE_H / 2;
  const diff = ball.y - cpuCenter;
  cpu.y += Math.sign(diff) * Math.min(3.5, Math.abs(diff));
  cpu.y = Math.max(0, Math.min(H - PADDLE_H, cpu.y));

  // Ball movement
  ball.x += ball.vx;
  ball.y += ball.vy;

  // Top/bottom bounce
  if (ball.y - BALL_R <= 0 || ball.y + BALL_R >= H) {
    ball.vy *= -1;
    ball.y = ball.y - BALL_R <= 0 ? BALL_R : H - BALL_R;
  }

  // Paddle collision
  if (ball.vx < 0 && ball.x - BALL_R <= player.x + PADDLE_W && ball.y >= player.y && ball.y <= player.y + PADDLE_H) {
    ball.vx = Math.abs(ball.vx) * 1.05;
    ball.vy += (ball.y - (player.y + PADDLE_H/2)) * 0.1;
    ball.x = player.x + PADDLE_W + BALL_R;
  }
  if (ball.vx > 0 && ball.x + BALL_R >= cpu.x && ball.y >= cpu.y && ball.y <= cpu.y + PADDLE_H) {
    ball.vx = -Math.abs(ball.vx) * 1.05;
    ball.vy += (ball.y - (cpu.y + PADDLE_H/2)) * 0.1;
    ball.x = cpu.x - BALL_R;
  }

  // Score
  if (ball.x < 0) { cpu.score++; resetBall(); }
  if (ball.x > W) { player.score++; resetBall(); }

  // Win check
  if (player.score >= WIN_SCORE || cpu.score >= WIN_SCORE) {
    running = false;
    canvas.classList.add('hidden');
    document.getElementById('winner').textContent = player.score >= WIN_SCORE ? 'YOU WIN!' : 'CPU WINS';
    document.getElementById('endScreen').classList.remove('hidden');
  }
}

function draw() {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);

  // Center line
  ctx.setLineDash([8, 8]);
  ctx.strokeStyle = 'rgba(245, 158, 11, 0.3)';
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // Score
  ctx.fillStyle = 'rgba(245, 158, 11, 0.4)';
  ctx.font = '48px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(player.score, W/2 - 60, 55);
  ctx.fillText(cpu.score, W/2 + 60, 55);

  // Paddles
  ctx.fillStyle = '#f59e0b';
  ctx.shadowColor = '#f59e0b';
  ctx.shadowBlur = 10;
  ctx.fillRect(player.x, player.y, PADDLE_W, PADDLE_H);
  ctx.fillRect(cpu.x, cpu.y, PADDLE_W, PADDLE_H);

  // Ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

document.addEventListener('keydown', e => { keys[e.key] = true; e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.key] = false; });
</script>
</body>
</html>
