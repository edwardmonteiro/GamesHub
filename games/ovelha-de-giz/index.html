<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#141918"><title>Ovelha de Giz — O Prado do Lobo</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101717;color:#fff;font-family:'Trebuchet MS',sans-serif}#screen{display:block;width:100vw;height:100dvh;object-fit:contain;background:#101717}#controlLayer{position:absolute;inset:0;pointer-events:none} .pad{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));width:clamp(60px,9vw,105px);height:clamp(60px,9vw,105px);border-radius:28px;background:rgba(240,251,242,.09);border:3px solid rgba(255,255,255,.65);font-size:clamp(26px,4vw,43px);color:#f2ffe7;box-shadow:inset 0 0 13px #ffffff15,0 0 10px #ffffff20;text-shadow:0 0 10px #ffffff8a;display:grid;place-items:center;pointer-events:auto;cursor:pointer} .pad:active,.pad.down{background:rgba(160,255,173,.28);transform:scale(.96)}#left{left:clamp(18px,3vw,45px)}#right{left:clamp(94px,13.2vw,165px)}#jump{right:clamp(18px,4vw,70px);border-color:#e9ce83;color:#ffe2a2;width:clamp(72px,10vw,118px);height:clamp(72px,10vw,118px);border-radius:50%;font-size:clamp(13px,2vw,24px);font-weight:900;letter-spacing:1px}#pause{position:absolute;top:clamp(14px,2vw,24px);right:clamp(16px,2.8vw,40px);height:45px;width:47px;border-radius:13px;font-size:24px;background:#111b1ea8;border:2px solid #f8faf6b0;pointer-events:auto;color:#fff}#mute{position:absolute;top:clamp(14px,2vw,24px);right:clamp(76px,8.6vw,110px);height:45px;width:47px;border-radius:13px;font-size:23px;background:#111b1ea8;border:2px solid #f8faf6b0;pointer-events:auto;color:#fff}#modal{position:absolute;inset:0;background:rgba(8,12,14,.68);display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(4px)}#modal.hidden{display:none}.panel{text-align:center;width:min(600px,94vw);max-height:96vh;overflow:auto;padding:clamp(16px,3vw,35px);border:3px dashed #e4e9cb;border-radius:28px;background:#162323;box-shadow:0 15px 65px #0008, inset 0 0 60px #31524d40}.panel h1{margin:0 0 5px;color:#f5efe2;font-family:'Comic Sans MS','Trebuchet MS',cursive;font-size:clamp(29px,5vw,57px);line-height:1.1;text-shadow:3px 3px #64877c}.panel h2{font-size:clamp(16px,2.7vw,27px);color:#ffcfa2;font-weight:600;margin:7px}.panel p{font-size:clamp(14px,2vw,19px);color:#d6e1da;line-height:1.45;margin:10px auto 18px;max-width:500px}.panel .sheep{font-size:clamp(38px,6vw,75px);margin:4px}button.primary{border:0;border-radius:18px;padding:14px 38px;font-size:clamp(16px,2.5vw,25px);font-weight:900;color:#183027;background:#f6d67a;box-shadow:0 5px #af8349;cursor:pointer}button.primary:active{transform:translateY(3px);box-shadow:0 2px #af8349}.tips{color:#b7cdc6!important;font-size:clamp(12px,1.5vw,15px)!important;margin-bottom:3px!important}#rotate{display:none}@media (orientation:portrait){#rotate{display:flex;align-items:center;justify-content:center;position:absolute;inset:0;background:#13201c;color:#fff;z-index:20;text-align:center;padding:30px;font-size:25px}#rotate:before{content:'↻';display:block;font-size:70px;margin-right:10px} }
</style></head><body><canvas id="screen" width="1280" height="720" aria-label="Jogo de plataforma 2D ovelha de giz"></canvas><div id="controlLayer"><button id="left" class="pad" aria-label="Mover para esquerda">◀</button><button id="right" class="pad" aria-label="Mover para direita">▶</button><button id="jump" class="pad" aria-label="Pular">PULAR ↥</button><button id="mute" aria-label="Ativar ou silenciar som">♫</button><button id="pause" aria-label="Pausar jogo">Ⅱ</button></div><div id="modal"><div class="panel"><div class="sheep">🐑 ✦ 🐺</div><h1 id="modalTitle">OVELHA DE GIZ</h1><h2 id="modalSub">FASE 1 — O Prado do Lobo</h2><p id="modalText">Resgate suas amigas! Corra, salte sobre os lobos, recolha estrelas e alcance o portal dourado.</p><button id="play" class="primary">COMEÇAR AVENTURA ▶</button><p class="tips">◀ ▶ para andar · PULAR para saltar · Toque no lobo por cima para vencê-lo</p></div></div><div id="rotate">Gire o celular para jogar na horizontal.</div>
<script>
'use strict';
(()=>{
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d');
const W=1280,H=720,G=1780,MAXX=5670,GROUND=577;
let mode='menu',last=0,acc=0,cam=0,clock=0,score=0,hearts=3,checkpoint=110,checkActive=false,shake=0,mute=false,audio=null,particles=[],keys={left:false,right:false,jump:false},jumpBuffered=0,stars=[],wolves=[],player;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(n)=>{let x=Math.sin(n*127.1+79.7)*43758.5453;return x-Math.floor(x)};
const segments=[{x:0,w:840,y:GROUND},{x:1020,w:990,y:GROUND},{x:2230,w:1010,y:538},{x:3380,w:970,y:GROUND},{x:4495,w:1185,y:GROUND}];
const bridges=[{x:840,y:577,w:180},{x:2010,y:577,w:220},{x:3238,y:538,w:142},{x:4350,y:577,w:145}];
const floating=[{x:680,y:424,w:154},{x:1150,y:419,w:151},{x:1440,y:343,w:155},{x:1940,y:410,w:173},{x:2370,y:389,w:162},{x:2765,y:335,w:173},{x:3190,y:429,w:178},{x:3610,y:389,w:160},{x:4010,y:337,w:166},{x:4620,y:390,w:200},{x:4910,y:340,w:172}];
const crates=[{x:1800,y:527,w:50,h:50},{x:3740,y:527,w:50,h:50},{x:3790,y:527,w:50,h:50},{x:3790,y:477,w:50,h:50}];
const spikes=[{x:2495,y:538,w:106},{x:4110,y:GROUND,w:118}];
const finishX=5525;
function reset(all=true){score=all?0:score;hearts=all?3:hearts;checkActive=all?false:checkActive;checkpoint=all?110:checkpoint;player={x:all?110:checkpoint,y:GROUND-58,w:53,h:57,vx:0,vy:0,onGround:false,coyote:0,face:1,invuln:0,anim:0};cam=0;particles=[];clock=0;wolves=[{x:1210,min:1110,max:1500,y:GROUND,w:66,h:48,vx:80,alive:true},{x:1840,min:1720,max:1950,y:GROUND,w:66,h:48,vx:-95,alive:true},{x:2720,min:2640,max:3090,y:538,w:66,h:48,vx:95,alive:true},{x:3680,min:3520,max:3930,y:GROUND,w:66,h:48,vx:-100,alive:true},{x:4740,min:4530,max:5050,y:GROUND,w:66,h:48,vx:115,alive:true}];let coords=[265,335,410,725,762,790,1154,1240,1445,1525,1590,1975,2310,2405,2560,2808,2880,2940,3260,3460,3630,3760,3950,4090,4450,4620,4725,4955,5090,5200,5370];stars=coords.map((x,i)=>({x,y:(i%5===0?GROUND-106:(x>2230&&x<3240?538:GROUND)-75)-(floating.some(p=>x>p.x&&x<p.x+p.w)?135:0),got:false,phase:i*.7}));}
function sound(freq=480,dur=.13,type='sine',vol=.09){if(mute)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(60,freq*.64),audio.currentTime+dur);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function burst(x,y,color,n=13){for(let i=0;i<n;i++){let a=Math.PI*2*i/n+(Math.random()-.5)*.6,s=40+Math.random()*230;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:.5+Math.random()*.6,max:1,color,r:2+Math.random()*4});}}
function setMode(m,title,sub,txt,label){mode=m;document.getElementById('modal').classList.toggle('hidden',m==='playing');document.getElementById('modalTitle').textContent=title;document.getElementById('modalSub').textContent=sub;document.getElementById('modalText').textContent=txt;document.getElementById('play').textContent=label;document.getElementById('pause').textContent=m==='playing'?'Ⅱ':'▶';}
function play(){if(mode==='menu'||mode==='won'||mode==='dead')reset(true);setMode('playing','','','','');sound(540,.09);}
function hurt(){if(player.invuln>0||mode!=='playing')return;hearts--;shake=12;sound(195,.26,'sawtooth',.12);burst(player.x+25,player.y+20,'#ffa4a6',18);if(hearts<=0){setMode('dead','FIM DE JOGO','O lobo venceu desta vez','Você chegou longe! Tente novamente e alcance suas amigas.','TENTAR NOVAMENTE ↻');return;}player.x=checkActive?checkpoint:Math.max(75,player.x-150);player.y=(checkActive?GROUND:GROUND)-90;player.vy=-450;player.vx=0;player.invuln=2.2;}
function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function update(dt){if(mode!=='playing')return;clock+=dt;player.anim+=dt*(1+Math.abs(player.vx)/120);player.invuln=Math.max(0,player.invuln-dt);const dir=(keys.right?1:0)-(keys.left?1:0);let target=dir*345,rate=player.onGround?2800:1800;player.vx+=clamp(target-player.vx,-rate*dt,rate*dt);player.coyote=player.onGround?.11:Math.max(0,player.coyote-dt);jumpBuffered=Math.max(0,jumpBuffered-dt);if(jumpBuffered>0&&player.coyote>0){player.vy=-755;player.coyote=0;player.onGround=false;jumpBuffered=0;sound(570,.18,'triangle');burst(player.x+23,player.y+56,'#e9f5d4',8);}if(!keys.jump&&player.vy<-250)player.vy+=G*.9*dt;
const oldBottom=player.y+player.h,oldTop=player.y;player.x=clamp(player.x+player.vx*dt,5,MAXX-player.w);player.vy=Math.min(1200,player.vy+G*dt);player.y+=player.vy*dt;player.onGround=false;
for(const p of [...segments,...floating,...bridges]){const py=p.y;if(player.vy>=0&&oldBottom<=py+12&&player.y+player.h>=py&&player.x+player.w>p.x+4&&player.x<p.x+p.w-4){player.y=py-player.h;player.vy=0;player.onGround=true;}}
for(const c of crates){if(!rectsOverlap(player.x,player.y,player.w,player.h,c.x,c.y,c.w,c.h))continue;if(oldBottom<=c.y+10&&player.vy>=0){player.y=c.y-player.h;player.vy=0;player.onGround=true;}else if(oldTop>=c.y+c.h-8&&player.vy<0){player.y=c.y+c.h;player.vy=0;}else if(player.x+player.w/2<c.x+c.w/2){player.x=c.x-player.w;player.vx=0;}else{player.x=c.x+c.w;player.vx=0;}}
if(dir!==0)player.face=dir;
for(const w of wolves){if(!w.alive)continue;w.x+=w.vx*dt;if(w.x<w.min){w.x=w.min;w.vx=Math.abs(w.vx)}if(w.x>w.max){w.x=w.max;w.vx=-Math.abs(w.vx)}if(rectsOverlap(player.x+9,player.y+4,player.w-18,player.h-4,w.x+7,w.y-w.h+5,w.w-14,w.h-8)){if(oldBottom<=w.y-w.h+22&&player.vy>80){w.alive=false;player.vy=-570;score+=250;sound(730,.23,'triangle');burst(w.x+32,w.y-30,'#ffe4a5',22);}else hurt();}}
for(const s of spikes){if(rectsOverlap(player.x+12,player.y+15,player.w-24,player.h-15,s.x+8,s.y-25,s.w-16,25))hurt();}
for(const st of stars){if(st.got)continue;if(Math.abs(player.x+25-st.x)<34&&Math.abs(player.y+27-(st.y+Math.sin(clock*2+st.phase)*8))<42){st.got=true;score+=100;sound(800,.13,'sine',.06);burst(st.x,st.y,'#f6de82',12);}}
if(player.x>3370&&!checkActive){checkActive=true;checkpoint=3430;score+=300;sound(940,.35,'sine');burst(3440,480,'#d6f4b6',24)}
if(player.x>finishX){let remaining=hearts*150;score+=remaining;try{localStorage.setItem('ovelha_giz_best',Math.max(score,+(localStorage.getItem('ovelha_giz_best')||0)))}catch(e){}sound(1050,.45,'triangle');setMode('won','VOCÊ CONSEGUIU!','As ovelhas estão a salvo!','Parabéns! Você venceu O Prado do Lobo com '+score+' pontos.','JOGAR NOVAMENTE ↻');}
if(player.y>H+180){hurt();player.y=150;player.vy=0;}
cam+=((clamp(player.x-W*.34,0,MAXX-W))-cam)*Math.min(1,dt*5.8);shake*=Math.pow(.045,dt);for(const pt of particles){pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=380*dt;pt.life-=dt;}particles=particles.filter(p=>p.life>0);}
// Chalk stroke helpers: layered fuzzy line plus sharp pastel center.
function line(points,color='#f0eadd',width=3){if(points.length<2)return;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.strokeStyle=color;ctx.globalAlpha=.16;ctx.lineWidth=width+5;ctx.stroke();ctx.globalAlpha=.95;ctx.lineWidth=width;ctx.stroke();ctx.globalAlpha=1;}
function ellipse(x,y,rx,ry,color='#efefdb',width=3){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.strokeStyle=color;ctx.lineWidth=width+5;ctx.globalAlpha=.12;ctx.stroke();ctx.lineWidth=width;ctx.globalAlpha=.96;ctx.stroke();ctx.globalAlpha=1;}
function chalkText(text,x,y,size=26,color='#eeeccc',align='left'){ctx.save();ctx.textAlign=align;ctx.font=`900 ${size}px 'Comic Sans MS', 'Trebuchet MS',sans-serif`;ctx.shadowColor=color;ctx.shadowBlur=5;ctx.globalAlpha=.92;ctx.fillStyle=color;ctx.fillText(text,x,y);ctx.restore();}
function star(x,y,r,spin=0){ctx.save();ctx.translate(x,y);ctx.rotate(spin);ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.46:r;let xx=Math.cos(a)*rad,yy=Math.sin(a)*rad;if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);}ctx.closePath();ctx.fillStyle='#f8d366';ctx.shadowColor='#ffda7b';ctx.shadowBlur=17;ctx.globalAlpha=.3;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#ffe9a1';ctx.lineWidth=3;ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='#fff4c2';ctx.lineWidth=1;ctx.stroke();ctx.restore()}
function grass(x,y,w){ctx.fillStyle='#3f714c';ctx.fillRect(x,y-8,w,9);line([[x,y-4],[x+w*.3,y-4],[x+w*.56,y-6],[x+w,y-4]],'#91e29d',4);for(let i=7;i<w;i+=16){let j=rand(x+i)*9;line([[x+i,y-4],[x+i-4,y-12-j]],'#b0eca2',2);}}
function terrain(x,y,w){ctx.fillStyle='#382c2a';ctx.fillRect(x,y,w,H-y+80);ctx.fillStyle='#46352d';for(let i=0;i<85;i++){const px=x+rand(i*19+x)*w,py=y+12+rand(i*74+x)*205;if(py<H+5){ctx.fillRect(px,py,3+rand(i)*6,3);}}for(let i=0;i<w;i+=75){let yy=y+26+rand(i+x)*135;line([[x+i,yy],[x+i+13,yy-3],[x+i+29,yy]],'#7d7067',2)}grass(x,y,w)}
function platform(p){ctx.fillStyle='#4c382d';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+p.w,p.y);ctx.lineTo(p.x+p.w-23,p.y+30);ctx.lineTo(p.x+24,p.y+39);ctx.closePath();ctx.fill();line([[p.x+24,p.y+35],[p.x+p.w-23,p.y+27]],'#7d6046',3);grass(p.x,p.y,p.w);}
function flower(x,y,c){line([[x,y],[x,y-19]],'#9cbd80',2);for(let i=0;i<5;i++){let a=i*Math.PI*2/5;ellipse(x+Math.cos(a)*8,y-24+Math.sin(a)*8,4,4,c,2)}ctx.fillStyle='#ffe4a2';ctx.fillRect(x-2,y-26,4,4)}
function tree(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);line([[0,0],[0,-130],[-27,-163]],'#b4977a',7);line([[0,-120],[32,-164]],'#b4977a',4);for(const [a,b,r] of [[-40,-175,44],[0,-195,53],[38,-165,40]]){ellipse(a,b,r,r*.69,'#5fae84',3);ellipse(a-6,b-2,r-6,r*.65,'#8bd8a1',1.5)}ctx.restore()}
function bush(x,y,s=1){for(let i=0;i<4;i++){ellipse(x+i*18*s,y-14*s-(i%2)*6*s,20*s,14*s,'#80d6a2',3)}}
function water(){ctx.save();ctx.fillStyle='#163a48';ctx.fillRect(0,661,MAXX+W,H);for(let i=0;i<65;i++){let x=i*120;line([[x,666+Math.sin(clock*2+i)*3],[x+20,666+Math.sin(clock*2+i+2)*3],[x+48,666+Math.sin(clock*2+i+3)*3]],'#76c4db',2.5);}ctx.restore()}
function chalkSheep(x,y,scale=1,face=1,run=0){ctx.save();ctx.translate(x,y);ctx.scale(scale*face,scale);const bounce=Math.sin(run*8)*2;ctx.translate(0,bounce);const body=[[-10,-23],[4,-35],[22,-32],[38,-21],[32,-8],[13,-4],[-5,-9]];for(let i=0;i<body.length;i++){let [cx,cy]=body[i];ellipse(cx,cy,13,12,'#f4f2e6',4);}line([[3,-10],[-1,8+Math.sin(run*8)*6]],'#f6ebdd',5);line([[24,-12],[29,8-Math.sin(run*8)*6]],'#f6ebdd',5);ellipse(36,-37,19,23,'#f2f0df',4);ctx.fillStyle='#252f31';ctx.beginPath();ctx.ellipse(40,-34,14,17,0,0,Math.PI*2);ctx.fill();ellipse(31,-57,10,8,'#f6ecdc',3);ellipse(43,-62,11,10,'#f6ecdc',3);ellipse(52,-57,9,8,'#f6ecdc',3);ellipse(57,-47,9,5,'#f6d3bd',2);ctx.fillStyle='#faf5e6';ctx.beginPath();ctx.ellipse(37,-39,5,7,0,0,Math.PI*2);ctx.ellipse(47,-39,5,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#172527';ctx.fillRect(38,-39,3,4);ctx.fillRect(48,-39,3,4);line([[42,-25],[48,-22],[52,-27]],'#f8e3c7',2);ellipse(-16,-19,8,7,'#eee9dc',3);ctx.restore()}
function chalkWolf(x,y,scale=1,dir=1,t=0){ctx.save();ctx.translate(x,y);ctx.scale(scale*dir,scale);ctx.fillStyle='#374246';ctx.beginPath();ctx.ellipse(0,-25,29,20,0,0,Math.PI*2);ctx.fill();ellipse(0,-25,29,20,'#bec6c6',3);line([[-16,-11],[-18,2+Math.sin(t*7)*3]],'#afc4c4',4);line([[15,-11],[20,2-Math.sin(t*7)*3]],'#afc4c4',4);line([[-24,-26],[-38,-41],[-39,-16]],'#c0c5c3',4);ctx.fillStyle='#455358';ctx.beginPath();ctx.moveTo(16,-33);ctx.lineTo(15,-60);ctx.lineTo(34,-46);ctx.lineTo(46,-61);ctx.lineTo(52,-28);ctx.closePath();ctx.fill();line([[16,-33],[15,-60],[34,-46],[46,-61],[52,-28]],'#c7c9c5',3);ctx.fillStyle='#455358';ctx.beginPath();ctx.ellipse(45,-29,25,16,0,0,Math.PI*2);ctx.fill();ellipse(45,-29,25,16,'#c7c9c5',2);line([[53,-31],[71,-25],[54,-19]],'#d7d0c6',3);ctx.fillStyle='#fff4dc';ctx.beginPath();ctx.ellipse(38,-40,5,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#221e1c';ctx.fillRect(40,-40,3,4);line([[25,-52],[40,-47]],'#ebc3b4',2);line([[13,-18],[33,-12],[46,-17]],'#ef8e92',6);ctx.restore()}
function bridge(x,y,w){line([[x,y-5],[x+w,y-5]],'#d3b184',7);for(let i=0;i<w;i+=35){line([[x+i,y-3],[x+i,y+16]],'#b3a081',2);line([[x+i+3,y+7],[x+i+26,y+7]],'#b3a081',2);}line([[x,y-22],[x+w*.5,y-12],[x+w,y-22]],'#dedac5',3);for(let i=0;i<=w;i+=75)line([[x+i,y-22],[x+i,y+9]],'#d9cdb8',3)}
function sign(x,y,label){line([[x+5,y],[x+5,y-73]],'#d0b083',5);ctx.fillStyle='#5e4537';ctx.fillRect(x-38,y-108,109,43);line([[x-38,y-108],[x+71,y-108],[x+71,y-65],[x-38,y-65],[x-38,y-108]],'#dbbb92',3);chalkText(label,x+16,y-79,17,'#faecd5','center')}
function flag(x,y){line([[x,y],[x,y-125]],'#e5e6d9',5);ctx.fillStyle='#c55a5d';ctx.beginPath();ctx.moveTo(x+3,y-123);ctx.lineTo(x+78,y-115);ctx.lineTo(x+60,y-87);ctx.lineTo(x+3,y-94);ctx.closePath();ctx.fill();chalkText('🐑',x+27,y-100,19)}
function drawBg(){ctx.fillStyle='#151d1c';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-cam*.16,0);for(let i=0;i<28;i++){let x=i*220-150;let xx=x+100;line([[x,500],[xx,440-(i%3)*22],[x+360,500]],'#253d39',3);}for(let i=0;i<24;i++){let x=i*315+rand(i)*65,y=65+rand(i+200)*155;ellipse(x,y,43+rand(i)*30,13,'#53635b',2);ellipse(x+33,y+4,23,11,'#53635b',2)}ctx.restore();ctx.save();ctx.translate(-cam*.35,0);for(let i=0;i<28;i++)tree(i*255+110,584,.35+rand(i)*.22);ctx.restore();for(let i=0;i<500;i++){let px=(i*173+rand(i)*1257)%W,py=(i*107+rand(i+17)*719)%H;ctx.globalAlpha=.045+rand(i)*.09;ctx.fillStyle='#f1e4da';ctx.fillRect(px,py,1.1,1.1);}ctx.globalAlpha=1;}
function drawWorld(){ctx.save();ctx.translate(-cam,0);water();for(const s of segments)terrain(s.x,s.y,s.w);for(const p of floating)platform(p);bridge(836,577,185);bridge(2010,577,223);bridge(3230,538,150);bridge(4350,577,145);for(let i=0;i<MAXX;i+=215){let seg=segments.find(s=>i>s.x+26&&i<s.x+s.w-50);if(!seg)continue;if(i%3===0)tree(i,seg.y,.68);else if(i%2===0)bush(i,seg.y,.68);else flower(i,seg.y,['#efbdba','#ead4a9','#a3d6e2'][Math.floor(rand(i)*3)]);}
for(const c of crates){ctx.fillStyle='#705039';ctx.fillRect(c.x,c.y,c.w,c.h);line([[c.x,c.y],[c.x+c.w,c.y],[c.x+c.w,c.y+c.h],[c.x,c.y+c.h],[c.x,c.y],[c.x+c.w,c.y+c.h]],'#dfb68a',3);line([[c.x+c.w,c.y],[c.x,c.y+c.h]],'#d7a777',3);}
for(const s of spikes){for(let x=s.x;x<s.x+s.w;x+=27){ctx.beginPath();ctx.moveTo(x,s.y);ctx.lineTo(x+13,s.y-31);ctx.lineTo(x+26,s.y);ctx.closePath();ctx.fillStyle='#a9b3af';ctx.globalAlpha=.44;ctx.fill();ctx.globalAlpha=1;line([[x,s.y],[x+13,s.y-31],[x+26,s.y]],'#f2eee7',3);}}
sign(470,GROUND,'LOBOS!');sign(2530,538,'CUIDADO');flag(3425,GROUND);
for(const st of stars)if(!st.got)star(st.x,st.y+Math.sin(clock*2+st.phase)*8,17+Math.sin(clock*3+st.phase),clock*.4+st.phase*.02);
for(const w of wolves)if(w.alive)chalkWolf(w.x+w.w/2,w.y,1,Math.sign(w.vx),clock);
// Rescue pen at end
for(let i=0;i<3;i++)chalkSheep(5300+i*75,GROUND-3,.82,(i%2)*2-1,clock*.4);
ctx.fillStyle='#c49d6d';ctx.fillRect(5455,GROUND-12,7,12);ctx.strokeStyle='#eadab7';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(5540,GROUND-69,56,91,0,Math.PI,0);ctx.stroke();ctx.fillStyle='#efcf7d';ctx.globalAlpha=.16;ctx.beginPath();ctx.ellipse(5540,GROUND-70,43,75,0,Math.PI,0);ctx.fill();ctx.globalAlpha=1;chalkText('CHEGADA!',5540,GROUND-180,25,'#ffe6a0','center');star(5540,GROUND-204,22,clock*.7);
if(player.invuln===0||Math.floor(clock*12)%2===0)chalkSheep(player.x+18,player.y+player.h,1.05,player.face,player.anim);
for(const p of particles){ctx.globalAlpha=clamp(p.life/.7,0,1);ellipse(p.x,p.y,p.r,p.r,p.color,2);}ctx.globalAlpha=1;ctx.restore();}
function hud(){ctx.fillStyle='#131b1bd9';ctx.fillRect(0,0,W,103);line([[0,104],[W,104]],'#6a7d73',2);chalkText('OVELHA DE GIZ',34,40,28,'#f3ede3');chalkText('FASE 1  ·  O PRADO DO LOBO',34,76,18,'#e5ce9c');star(505,50,20);chalkText(String(score).padStart(5,'0'),539,61,33,'#fff0b3');for(let i=0;i<3;i++)chalkText(i<hearts?'♥':'♡',790+i*53,66,43,i<hearts?'#ed9c9e':'#7b8581');let start=969,len=143;ctx.fillStyle='#526a61';ctx.fillRect(start,49,len,9);ctx.fillStyle='#b4e5ab';ctx.fillRect(start,49,len*clamp(player.x/finishX,0,1),9);chalkText('CHEGADA',start+len/2,38,15,'#ddeaca','center');if(clock<6&&mode==='playing'){ctx.globalAlpha=clamp((6-clock)/1.5,0,1)*.9;chalkText('◀   ANDAR   ▶        PULAR ↥',W/2,196,30,'#f5e7d5','center');ctx.globalAlpha=1;}}
function render(){ctx.clearRect(0,0,W,H);ctx.save();ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawBg();drawWorld();ctx.restore();hud();}
function loop(ts){if(!last)last=ts;let dt=Math.min(.05,(ts-last)/1000);last=ts;acc+=dt;let loops=0;while(acc>=1/60&&loops++<4){update(1/60);acc-=1/60;}render();requestAnimationFrame(loop)}
function setKey(k,v){if(k==='jump'&&v&&!keys.jump){jumpBuffered=.15;}keys[k]=v;}
for(const id of ['left','right','jump']){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();if(mode!=='playing')return;setKey(id,true);el.classList.add('down');try{el.setPointerCapture(e.pointerId)}catch(a){}},{passive:false});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,e=>{setKey(id,false);el.classList.remove('down');});}
window.addEventListener('keydown',e=>{let k={'ArrowLeft':'left','KeyA':'left','ArrowRight':'right','KeyD':'right','Space':'jump','ArrowUp':'jump','KeyW':'jump'}[e.code];if(k){e.preventDefault();setKey(k,true);}if(e.code==='Escape'||e.code==='KeyP')togglePause();});window.addEventListener('keyup',e=>{let k={'ArrowLeft':'left','KeyA':'left','ArrowRight':'right','KeyD':'right','Space':'jump','ArrowUp':'jump','KeyW':'jump'}[e.code];if(k){e.preventDefault();setKey(k,false);}});window.addEventListener('blur',()=>{if(mode==='playing')togglePause();for(const k of Object.keys(keys))keys[k]=false;});
function togglePause(){if(mode==='playing')setMode('paused','PAUSA','A aventura pode esperar','Toque para continuar de onde parou.','CONTINUAR ▶');else if(mode==='paused')play();}
document.getElementById('pause').addEventListener('click',togglePause);document.getElementById('mute').addEventListener('click',()=>{mute=!mute;document.getElementById('mute').textContent=mute?'♪̸':'♫';});document.getElementById('play').addEventListener('click',play);
canvas.addEventListener('pointerdown',e=>{if(mode==='playing'&&e.clientY>window.innerHeight*.48){jumpBuffered=.14;keys.jump=true;setTimeout(()=>{keys.jump=false},170)}});
reset();render();requestAnimationFrame(loop);
})();
</script></body></html>
